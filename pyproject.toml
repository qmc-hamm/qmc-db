[project]
name = "qmc-db"
version = "0.1.0"
description = "QMC-HAMM database library and utility scripts"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "intake",
    "s3fs>=2024.3.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmc_repo"]
